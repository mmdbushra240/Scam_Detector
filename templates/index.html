<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship & Job Scam Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafa; }
        .card { border-radius: 12px; border: none; }
        .drop-zone {
            border: 2px dashed #fd0de9;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: #f1f5fe;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background-color: #e2fefe;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <h1 class="fw-bold text-primary">Job Scam Detector</h1>
                <p class="text-muted">Analyze offer letters and job postings to guard against fraudulent offers.</p>
            </div>

            <!-- Tab Navigation -->
            <ul class="nav nav-pills nav-justified mb-3" id="scanTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold" id="text-tab" data-bs-toggle="pill" data-bs-target="#text-content" type="button" role="tab">
                        📄 Paste Text
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold" id="file-tab" data-bs-toggle="pill" data-bs-target="#file-content" type="button" role="tab">
                        📁 Upload Document / Image
                    </button>
                </li>
            </ul>

            <div class="card shadow-sm p-4 mb-4">
                <!-- Shared Input Fields: Email & Money Checkbox -->
                <div class="row mb-3">
                    <div class="col-md-7">
                        <label for="senderEmail" class="form-label fw-semibold">Sender Email Address </label>
                        <input type="email" class="form-control" id="senderEmail" placeholder="recruiter@company.com">
                    </div>
                    <div class="col-md-5 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="asksMoney">
                            <label class="form-check-label text-danger fw-semibold" for="asksMoney">
                                Requests money / deposit upfront?
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Tab Panels -->
                <div class="tab-content" id="scanTabContent">
                    <!-- Text Tab -->
                    <div class="tab-pane fade show active" id="text-content" role="tabpanel">
                        <div class="mb-3">
                            <label for="jobText" class="form-label fw-semibold">Offer Letter / Job Posting Text</label>
                            <textarea class="form-control" id="jobText" rows="6" placeholder="Paste full email or offer letter body text here..."></textarea>
                        </div>
                        <button class="btn btn-primary w-100 py-2 fw-bold" onclick="analyzeText()">Analyze Text</button>
                    </div>

                    <!-- File Upload Tab -->
                    <div class="tab-pane fade" id="file-content" role="tabpanel">
                        <div class="drop-zone mb-3" id="dropZone" onclick="document.getElementById('fileInput').click()">
                            <p class="mb-1 fw-bold text-primary" id="fileNameDisplay">Drag & Drop file here or Click to Browse</p>
                            <small class="text-muted">Supports PDF, PNG, JPG, JPEG</small>
                            <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" style="display: none;" onchange="handleFileSelect(event)">
                        </div>
                        <button class="btn btn-success w-100 py-2 fw-bold" onclick="analyzeFile()">Analyze Uploaded File</button>
                    </div>
                </div>
            </div>

            <!-- Analysis Output Section -->
            <div id="resultCard" class="card shadow-sm p-4 d-none">
                <h4 class="fw-bold mb-3">Analysis Result</h4>
                <div class="mb-3">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="fw-bold">Risk Assessment: <span id="verdictText">---</span></span>
                        <span class="fw-bold" id="scoreText">0%</span>
                    </div>
                    <div class="progress" style="height: 22px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
                    </div>
                </div>

                <div id="textPreviewContainer" class="alert alert-secondary d-none">
                    <strong>Extracted Text Snippet:</strong>
                    <p id="textPreview" class="mb-0 text-muted small"></p>
                </div>

                <h6 class="fw-bold mt-3">Detected Risk Factors:</h6>
                <ul id="flagsList" class="list-group list-group-flush mb-2"></ul>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none mt-3" role="alert"></div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    // Drag and drop event handling
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    });
    dropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            updateFileNameDisplay();
        }
    });

    function handleFileSelect(e) {
        updateFileNameDisplay();
    }

    function updateFileNameDisplay() {
        if (fileInput.files.length > 0) {
            fileNameDisplay.textContent = `Selected File: ${fileInput.files[0].name}`;
        }
    }

    // Helper to render assessment metrics on UI
    function renderResult(data) {
        document.getElementById('errorAlert').classList.add('d-none');
        const resultCard = document.getElementById('resultCard');
        const verdictText = document.getElementById('verdictText');
        const scoreText = document.getElementById('scoreText');
        const progressBar = document.getElementById('progressBar');
        const flagsList = document.getElementById('flagsList');
        const previewContainer = document.getElementById('textPreviewContainer');
        const previewText = document.getElementById('textPreview');

        resultCard.classList.remove('d-none');
        const score = data.risk_score;
        const status = data.status || data.verdict;

        scoreText.textContent = `${score}/100`;
        verdictText.textContent = status;

        progressBar.style.width = `${score}%`;
        progressBar.textContent = `${score}%`;

        // Color coding progress bar
        progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated ';
        if (score >= 60) {
            progressBar.classList.add('bg-danger');
            verdictText.className = 'text-danger fw-bold';
        } else if (score >= 30) {
            progressBar.classList.add('bg-warning', 'text-dark');
            verdictText.className = 'text-warning fw-bold';
        } else {
            progressBar.classList.add('bg-success');
            verdictText.className = 'text-success fw-bold';
        }

        // Render Flags
        flagsList.innerHTML = '';
        if (data.flags && data.flags.length > 0) {
            data.flags.forEach(flag => {
                const li = document.createElement('li');
                li.className = 'list-group-item list-group-item-light text-danger';
                li.textContent = `• ${flag}`;
                flagsList.appendChild(li);
            });
        } else {
            const li = document.createElement('li');
            li.className = 'list-group-item list-group-item-light text-success';
            li.textContent = 'No obvious warning flags detected.';
            flagsList.appendChild(li);
        }

        // Render extracted text preview if returned by OCR route
        if (data.extracted_text_preview) {
            previewContainer.classList.remove('d-none');
            previewText.textContent = data.extracted_text_preview;
        } else {
            previewContainer.classList.add('d-none');
        }
    }

    function showError(message) {
        document.getElementById('resultCard').classList.add('d-none');
        const errAlert = document.getElementById('errorAlert');
        errAlert.textContent = message;
        errAlert.classList.remove('d-none');
    }

    // Submit Text to /api/analyze Endpoint
    async function analyzeText() {
        const text = document.getElementById('jobText').value;
        const email = document.getElementById('senderEmail').value;
        const asksMoney = document.getElementById('asksMoney').checked;

        if (!text || text.trim().length < 10) {
            showError("Please enter at least 10 characters of job description or offer text.");
            return;
        }

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    job_text: text,
                    sender_email: email,
                    asks_money: asksMoney
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || "Server error analyzing text.");
            }

            const data = await response.json();
            renderResult(data);
        } catch (err) {
            showError(err.message);
        }
    }

    // Submit File to /api/analyze-file Endpoint
    async function analyzeFile() {
        if (fileInput.files.length === 0) {
            showError("Please select or drop a PDF or image file first.");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('sender_email', document.getElementById('senderEmail').value);
        formData.append('asks_money', document.getElementById('asksMoney').checked);

        try {
            const response = await fetch('/api/analyze-file', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || "Server error processing file.");
            }

            const data = await response.json();
            renderResult(data);
        } catch (err) {
            showError(err.message);
        }
    }
</script>
</body>
</html>
